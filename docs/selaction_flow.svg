<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" role="img" aria-label="SelAction calculation flow">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#14243b} .title{font-size:16px;font-weight:700} .sub{font-size:12px;fill:#486175} .node{fill:#f4f8fb;stroke:#93aabb;stroke-width:1.4} .accent{fill:#e7f2ef;stroke:#2f796b;stroke-width:1.5} .path{fill:none;stroke:#57748a;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#57748a"/></marker>
  </defs>
  <rect width="960" height="285" fill="white"/>
  <text class="title" x="28" y="31">Shared mathematical core</text>
  <rect class="node" x="28" y="64" width="190" height="80" rx="9"/><text class="title" x="45" y="93">Trait inputs</text><text class="sub" x="45" y="115">variances · correlations</text><text class="sub" x="45" y="132">economic weights</text>
  <rect class="node" x="276" y="64" width="190" height="80" rx="9"/><text class="title" x="293" y="93">Covariance blocks</text><text class="sub" x="293" y="115">own · relatives · progeny</text><text class="sub" x="293" y="132">P and G matrices</text>
  <rect class="accent" x="524" y="64" width="190" height="80" rx="9"/><text class="title" x="541" y="93">Selection index</text><text class="sub" x="541" y="115">solve P b = G v</text><text class="sub" x="541" y="132">variance · accuracy</text>
  <path class="path" d="M218 104H267"/><path class="path" d="M466 104H515"/>
  <path class="path" d="M714 104H760V70H778"/><path class="path" d="M714 104H760V213H778"/>
  <rect class="node" x="779" y="29" width="155" height="91" rx="9"/><text class="title" x="795" y="57">Discrete</text><text class="sub" x="795" y="78">1–3 joint stages</text><text class="sub" x="795" y="97">per generation</text>
  <rect class="node" x="779" y="168" width="155" height="91" rx="9"/><text class="title" x="795" y="196">Overlapping</text><text class="sub" x="795" y="217">age-class weights</text><text class="sub" x="795" y="236">per cohort interval</text>
  <path class="path" d="M619 145V222H466"/><text class="sub" x="485" y="211">25 covariance rounds</text>
  <text class="sub" x="28" y="266">Sire and dam paths are calculated separately and averaged in the response.</text>
</svg>
