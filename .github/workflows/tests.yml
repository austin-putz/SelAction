# Builds SelAction and runs every test layer on Linux and macOS (Apple
# Silicon), plus the README's MSYS2 route on Windows.
# See tests/README.md ("Continuous integration").

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run; pushes to
# main all run to the end, so every commit on main gets a result.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, id: linux,      name: "ubuntu-latest (gfortran 14)",            compiler: setup }
          - { os: macos-latest,  id: macos,      name: "macos-latest (gfortran 14)",             compiler: setup }
          # Exactly the README's route for Mac users: brew install gcc
          # (whatever gfortran Homebrew currently ships).
          - { os: macos-latest,  id: macos-brew, name: "macos-latest (brew install gcc, README)", compiler: brew }
    steps:
      # The test runners keep the folder of a failed test under TMPDIR;
      # the last step uploads it.
      - name: Temp folder for test outputs
        run: |
          mkdir -p "$RUNNER_TEMP/selaction-tests"
          echo "TMPDIR=$RUNNER_TEMP/selaction-tests" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: fortran-lang/setup-fortran@v1
        if: matrix.compiler == 'setup'
        with:
          compiler: gcc
          version: 14

      - name: Install gfortran with Homebrew (as in the README)
        if: matrix.compiler == 'brew'
        run: |
          brew install gcc
          echo "FC=$(brew --prefix)/bin/gfortran" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Versions
        run: |
          uname -a
          $FC --version | head -1
          Rscript --version
          make --version | head -1

      - name: Build
        run: make

      - name: Comparison tool self-test
        run: tests/tools/selftest.sh

      # The stored outputs come from macOS Intel. Linux matches them byte
      # for byte; Apple Silicon differs in a last digit in test1 and blup1
      # (tests/README.md, "Continuous integration"), so there only the
      # tolerant comparison below is required.
      - name: Golden fixtures (byte-exact)
        continue-on-error: ${{ runner.os == 'macOS' }}
        run: tests/run_tests.sh build

      - name: Golden fixtures (tolerant)
        if: success() || failure()
        run: tests/run_tests.sh --tolerant build

      - name: Error cases
        if: success() || failure()
        run: tests/run_error_tests.sh build

      - name: Strict debug build
        if: success() || failure()
        run: tests/tools/strict.sh

      # Catches values used before they are set, which can change results
      # only on some machines or runs (the 2026-10-09 ovlp2 failure).
      - name: Memory check (valgrind)
        if: runner.os == 'Linux' && (success() || failure())
        run: |
          sudo apt-get install -y -qq valgrind > /dev/null
          tests/tools/memcheck.sh

      - name: Coverage (report only)
        if: runner.os == 'Linux' && (success() || failure())
        run: tests/tools/coverage.sh

      - name: Keep outputs of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failed-tests-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/selaction-tests/
            build/**/*.log
          if-no-files-found: warn

  windows:
    name: windows-latest (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # Keep the stored .out files byte for byte (no CRLF conversion).
      - run: git config --global core.autocrlf false
        shell: bash

      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc-fortran make diffutils

      - name: Temp folder for test outputs
        run: |
          d="$(cygpath -u "$RUNNER_TEMP")/selaction-tests"
          mkdir -p "$d"
          echo "TMPDIR=$d" >> "$GITHUB_ENV"

      - name: Versions
        run: |
          gfortran --version | head -1
          make --version | head -1

      - name: Build
        run: make

      - name: Golden fixtures (byte-exact)
        run: tests/run_tests.sh build

      - name: Error cases
        if: success() || failure()
        run: tests/run_error_tests.sh build

      - name: Keep outputs of failed tests
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failed-tests-windows
          path: |
            ${{ runner.temp }}/selaction-tests/
            build/**/*.log
          if-no-files-found: warn
