<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-label="Generation interval: intended computation versus the original code">
  <defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#14243b;font-size:14px}
.head{font-size:17px;font-weight:700}
.small{font-size:13px;fill:#476276}
.tiny{font-size:12px;fill:#476276}
.s{fill:#e5f0ed;stroke:#2d756b;stroke-width:1.5}
.d{fill:#e9eef5;stroke:#4f719b;stroke-width:1.5}
.sdot{fill:#2d756b}
.ddot{fill:#4f719b}
.pdot{fill:#b07a12}
.out{fill:#f7f8fa;stroke:#8294a5;stroke-width:1.4}
.line{stroke:#8294a5;stroke-width:1.6;fill:none}
.pline{stroke:#b07a12;stroke-width:2;fill:none;stroke-dasharray:6 4}
.axis{stroke:#647e90;stroke-width:1.3;fill:none}
.grid{stroke:#e3e8ee;stroke-width:1}
.arrow{stroke:#647e90;stroke-width:2;fill:none;marker-end:url(#a)}
</style><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#647e90"/></marker></defs>
  <rect width="920" height="290" fill="white"/>
  <text class="head" x="25" y="31">Generation interval from the selected numbers (dams of the ovlpgrp example)</text>
  <rect class="d" x="110" y="84.7" width="90" height="165.3"/>
  <text class="small" x="155" y="270" text-anchor="middle">age class 1</text>
  <text x="155" y="76.7" text-anchor="middle">n = 194.5, w = 0.9725</text>
  <rect class="d" x="260" y="245.3" width="90" height="4.7"/>
  <text class="small" x="305" y="270" text-anchor="middle">age class 2</text>
  <text x="305" y="237.3" text-anchor="middle">n = 5.5, w = 0.0275</text>
  <path class="axis" d="M80 60V250H410"/>
  <rect class="out" x="450" y="70" width="440" height="78" rx="8"/>
  <text x="462" y="92">Intended (and now computed):</text>
  <text class="small" x="462" y="110">L_d = Σ c·w_c = 1×0.9725 + 2×0.0275 = 1.0275</text>
  <text class="small" x="462" y="128">same for sires (all from class 1: L_s = 1); L = (L_s + L_d)/2 = 1.014</text>
  <rect class="out" x="450" y="165" width="440" height="98" rx="8"/>
  <text x="462" y="187">Original code (assignment instead of sum):</text>
  <text class="small" x="462" y="205">L_d ← (value left by trunc_delta) + c*·w_c*  for the last active class c*</text>
  <text class="small" x="462" y="223">   = 1.0275 + 2×0.0275 = 1.083 on these numbers: class 2 counted twice</text>
  <text class="small" x="462" y="241">specified-count mode: trunc_delta never runs, L_d ← c*·w_c* only</text>
</svg>
